name: Idea
description: Suggest something Plume should do
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Plume to do
    validations:
      required: true

  - type: textarea
    id: moment
    attributes:
      label: The moment it would have helped
      description: >
        The last time you actually wanted this, and what you did instead. Concrete beats general —
        it's the difference between a feature and a request.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: The scope test
      description: >
        Plume is a panel you summon over your work, write in, and dismiss. Every feature that makes
        it more like a full notes app makes it less like the thing that was wanted.
      options:
        - label: This helps the first ten seconds after the hotkey.
          required: false
